<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise</title>

<style>
/* 表格樣式 */
table {
    border-collapse: collapse;
    width: 300px;
    margin: 50px;
}

th, td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
}

/* 表頭 */
th {
    background-color: gray;
    color: white;
}

/* 奇數列 */
tr:nth-child(odd) td {
    background-color: white;
}

/* 偶數列 */
tr:nth-child(even) td {
    background-color: yellow;
}

/* 固定在右上角的 div */
.fixed-box {
    position: fixed;
    top: 20px;
    right: 20px;
    border: 3px solid green;
    padding: 15px;
    width: 150px;
    background-color: white;
}
</style>

</head>

<body>

<!-- 表格 -->
<table>
    <tr>
        <th>Firstname</th>
        <th>Lastname</th>
    </tr>
    <tr>
        <td>1</td>
        <td>1</td>
    </tr>
    <tr>
        <td>2</td>
        <td>2</td>
    </tr>
    <tr>
        <td>3</td>
        <td>3</td>
    </tr>
</table>

<!-- 右上角固定 div -->
<div class="fixed-box">
    This div element has<br>
    position: fixed;
</div>

</body>
</html>
