<!DOCTYPE html>
<html>
<head>
    <title>作業14</title>
</head>
<body>

    <canvas id="myCanvas" width="400" height="300">
    </canvas>

    <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");

        ctx.fillStyle = "blue";
        ctx.fillRect(50, 50, 150, 120); 
        
        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;
        ctx.strokeRect(50, 50, 150, 120);

        ctx.beginPath();
        ctx.arc(170, 110, 50, 0, 2 * Math.PI);
        ctx.fillStyle = "yellow";
        ctx.fill(); 
        
        ctx.strokeStyle = "red";
        ctx.lineWidth = 5;
        ctx.stroke(); 
    </script>

</body>
</html>
