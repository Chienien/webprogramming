<!DOCTYPE html>
<html
<head>
    <style>
        .box {
            font-family: serif;
            font-weight: bold;
            font-size: 24px;
            padding: 10px;
           
            padding-right: 60px; 
            width: fit-content;
            margin-bottom: 20px;
        }

        .box-1 { background-color: lightblue; border: 5px double tomato; }
        .box-2 { background-color: yellow; border: 2px solid blue; border-radius: 15px; }
        .box-3 { background-color: #3cb371; border: 5px dotted gray; }
    </style>
</head>
<body>
    <div class="box box-1">Hello World</div>
    <div class="box box-2">Hello World</div>
    <div class="box box-3">Hello World</div>
</body>
</html>
