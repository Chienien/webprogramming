<!DOCTYPE html>
<html>
<head>
    <title>exercise18</title>
    <style>
        .container {
            width: 600px;
            padding: 20px;
            font-family: serif;
        }

        .h1-style {
            text-decoration: overline;
            font-weight: bold;       
            font-size: 32px;
            width: fit-content;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px pink; 
        }

  
        .h2-style {
            background-color: white;
            font-weight: bold;         
            font-style: italic;       
            
            border: 1px solid black;  
            box-shadow: 0 0 5px 3px yellow; 
            
            width: fit-content;
            padding: 10px 20px;
            margin: 15px 5px 40px 5px; 
        }

        .h3-style {
            text-align: right;      
            text-decoration: underline;
            font-weight: bold;      
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="h1-style">This is heading 1</div>
        
        <div class="h2-style">This is heading 2</div>
        
        <div class="h3-style">This is heading 3</div>
    </div>

</body>
</html>
